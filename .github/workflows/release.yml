name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build, test and package
        shell: pwsh
        run: ./publish.ps1
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "release/DiskSpaceMonitor-win-x64.zip"
          "release/DiskSpaceMonitor-win-x64-compact.zip"
          "install-dotnet.ps1"
          --title "Disk Space Monitor ${{ github.ref_name }}"
          --generate-notes
